# qypr-bar example configuration
#
# Copy to $XDG_CONFIG_HOME/qypr/bar.conf (usually ~/.config/qypr/bar.conf).
# Everything here is optional: qypr-bar runs with no config at all, and every
# key falls back to the compiled-in default shown below. Read once at startup —
# restart the bar to apply changes.
#
# Syntax: [sections], `key = value`, and full-line comments (# or //).
# Comments must be on their own line: a trailing # would corrupt values such as
# the clock's strftime format.

[bar]
# Which screen edge to anchor to: top | bottom
position = top

# Height of the bar strip itself, in logical pixels.
height = 32

# Gap between the strip and the anchored screen edge. The reserved exclusive
# zone (the space tiled windows keep clear) is margin + height + 6.
margin = 0.00

# Gap at the left and right ends of the strip.
margin-side = 6

# Frosted-glass strip opacity, 0..1. The strip is a translucent frosted panel
# (surface tint + a light top sheen + a hairline border), matching the popovers;
# this key sets how opaque the tint is. On a blur-capable compositor, add a blur
# rule for the "qypr-bar" layer (e.g. Hyprland: `layerrule = blur, qypr-bar`)
# and a lower value (~0.4) reads as real frosted glass. Without blur, keep it
# higher (~0.8) so the glyphs stay legible over an arbitrary wallpaper.
# 0 = fully chromeless (transparent strip, may be hard to read).
backdrop = 0.03

# Modules, in visual order (left → right within each zone). Any module may go
# in any zone. Omit a key to keep the default set; give it an empty value to
# empty that zone. Unknown ids are reported on stderr and skipped.
#
# Available: active-window, battery, bluetooth, brightness, clock, dnd,
#            idle-inhibitor, keyboard-layout, launcher, media, night-light,
#            notifications, power, sni, system-monitor, taskbar, volume, wifi,
#            workspaces
#
# `taskbar` is an icons-only window list (click to focus, or minimize the
# focused window); `media`/`notifications`/`power` are the session applets.
# All four are session-sensitive — they never appear on the lock screen.
# `system-monitor` (CPU/RAM meters) is opt-in — it only appears when listed
# here, never on the lock screen or a config-less bar. `idle-inhibitor` is a
# "keep awake" toggle (click to hold the screen on); it hides when the
# compositor lacks the idle-inhibit protocol. `keyboard-layout` shows the active
# xkb layout code (e.g. US / RU) — opt-in, and it hides itself unless more than
# one layout is configured (a single layout has nothing to switch between).
# `launcher` (keyboard-driven app search) is **experimental/shelved** — the code
# is built and gated bar-only, but it is not enabled by default; list it in a
# modules- line to try it.
#
# The right-side group (WiFi, Battery, Clock, etc.) is drawn as a single
# rounded filled-surface chip. Clicking anywhere on it reveals Quick Settings
# (Ubuntu-style). Indicators with their own detailed views (WiFi AP picker,
# battery) open those first — click them again to open Quick Settings.
modules-left = workspaces, taskbar
modules-center = active-window
modules-right = brightness, volume, wifi, battery, clock, idle-inhibitor, power

[clock]
# strftime(3) patterns. `format` is the bar text; `tooltip-format` is the hover
# text. Examples:
#   %H:%M                 → 14:05          (24-hour)
#   %a %b %-d   %-I:%M %p → Thu Jul 17  2:05 PM
#   %I:%M %p%n%m/%d/%y    → two lines (%n = newline)
format = %-I:%M %p
#format = %a %b %-d   %-I:%M %p
tooltip-format = %A, %B %-d

# Clicking the clock opens a month calendar. `timezones` (optional, comma-
# separated IANA names) adds a live clock per zone under the calendar. Omit or
# leave empty for none.
# timezones = Asia/Tokyo, America/New_York, Europe/London

[system-monitor]
# Compact CPU/RAM meters. Re-samples /proc on the bar's 1s tick — the one
# indicator that legitimately polls (CPU/RAM have no push source). Only shown
# when `system-monitor` is in a modules- list above.
# `metrics`: which meters, in order — cpu, mem (aka ram).
metrics = cpu, mem
# `interval`: milliseconds between /proc samples (min 500).
interval = 2000

[night-light]
# Night Light: shift screen colour temperature to reduce blue light.
# Requires wlr-gamma-control-unstable-v1 (wlroots compositors: sway,
# Hyprland, etc.).  On compositors without the protocol the indicator
# hides automatically.
#
# temperature: colour temperature in Kelvin when Night Light is on.
#              Range: 2700 (warmest) — 6500 (daylight/off).  Default: 4000.
temperature = 4500

[quick-settings]
# Commands the Quick Settings panel buttons run. They inherit qypr-bar's
# environment (so WAYLAND_DISPLAY etc. are already correct — do NOT hardcode a
# display). Each runs detached in the background.
#   screenshot-command: the Screenshot tile. Default: interactive grimblast
#       (grimblast --notify copysave area), falling back to `flameshot gui` only
#       if grimblast is absent. grimblast lets you drag-select a region, copies
#       it to the clipboard AND saves a file, and notifies — native on wlroots.
#       (flameshot v14 is broken on Hyprland — flameshot-org/flameshot#4666.)
#   power-command:      the power button. Default: waylaunch --power
#
# The default already does the right thing; set this only to customise. E.g.:
screenshot-command = grimblast --notify copysave area
# power-command = waylaunch --power

[theme]
# Visual design overrides. Every key is optional — omit any to keep the
# compiled-in Catppuccin Mocha default. Restart the bar to apply.
#
# Style preset (popover rendering):
#   "glass"  — frosted translucent popover cards (default).
#   "solid"  — opaque cards, same hue, no translucency.
# ("macos" is still accepted as a backward-compatible alias for "glass".)
# The translucent menu-bar backdrop (tint + hairline) is always available and is
# driven by the bar-tint / bar-border keys below — no preset required.
style = solid
#
# Icon style — how each applet draws its icon:
#   "auto"     — a symbolic icon from your active system icon theme
#                (gtk-icon-theme-name) when it provides one, else the built-in
#                Nerd Font glyph. Adopts your desktop theme on the fly. (default)
#   "symbolic" — always prefer the system icon theme (still falls back to the
#                glyph for any icon the theme happens to lack).
#   "glyph"    — always use the built-in Nerd Font glyphs; ignore the icon theme.
icon-style = symbolic

bar-symbolic-icon-size = 20
#
# Fonts
# font-family = Inter
# icon-family = CaskaydiaCove Nerd Font
# font-size = 16
# font-size-large = 24
# font-size-clock = 96
# font-size-date = 28
#
# Colours (hex: #RRGGBB or #AARRGGBB)
background = #282828
surface = #3c3836
surface-hover = #504945
# glass = #40313244
# glass-hover = #60454a5a
# glass-border = #30cdd6f4
primary = #fabd2f
# primary-glow = #4089b4fa
text = #ebdbb2
text-subtle = #d5c4a1
text-muted = #a89984
error = #fb4934
success = #b8bb26
warning = #fabd2f
#
# Menu-bar backdrop. Lives under the [theme] section so it re-applies live via
# the ConfigWatcher. The `bar.backdrop` key (above, [bar] section) sets the slot
# opacity 0..1; 0 disables the strip backdrop. The tint and border COLOURS
# default to this theme's `background` and `text` above, so the strip follows
# your palette automatically — set the keys below only to override.
# bar-tint          = #282828     # tint colour (defaults to `background`)
# bar-tint-alpha    = 0.80        # 0=invisible, 1=opaque
# bar-border-color  = #ffffff     # hairline separator colour (defaults to `text`)
# bar-border-alpha  = 0.10        # 0=no border, 1=opaque line
# bar-border        = true       # draw the hairline at all
#
# Spacing (int px)
# spacing-small = 8
# spacing-medium = 16
# spacing-large = 24
# spacing-xlarge = 48
#
# Radius (int px)
# radius-small = 4
# radius-medium = 8
# radius-large = 16
#
# Animation durations (ms)
# anim-fast = 150
# anim-medium = 300
# anim-slow = 500
# anim-reveal = 600
#qypr-lock --preview
# Effects
# shadow-opacity = 0.6
# shadow-offset = 2
# (ctrl+o to expand)

# Statusbar
# bar-height = 36.0
# bar-icon-size = 16.0            # Nerd Font glyph size (icon-style = glyph)
# bar-symbolic-icon-size = 18.0   # themed *-symbolic icon size (icon-style = auto/symbolic);
#                                 #   raise this to enlarge the themed icons without
#                                 #   growing the bar — try 20–24
# bar-icon-spacing = 18.0
# bar-padding = 14.0
# bar-corner-radius = 12.0
# popover-radius = 12.0
#
# Workspace indicators
# ws-width = 28
# ws-height = 6
# ws-gap = 6
# ws-active-height = 8
# ws-radius = 999
#
# Tray (SNI)
sni-size = 22
#
# Launcher popover
# launcher-width = 560
# launcher-max-visible = 12
# launcher-radius = 22.0
